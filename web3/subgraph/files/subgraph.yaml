specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Counter
    network: mainnet
    source:
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      abi: Counter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NumberChanged
        - Counter
      abis:
        - name: Counter
          file: ./abis/Counter.json
      eventHandlers:
        - event: NumberChanged(uint256,uint256)
          handler: handleNumberChanged
      file: ./src/mapping.ts
