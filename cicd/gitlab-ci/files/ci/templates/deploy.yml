# Deploy jobs template
.deploy-base:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts

deploy-staging:
  extends: .deploy-base
  variables:
    DEPLOY_HOST: $STAGING_HOST
    DEPLOY_ENV: staging
  script:
    - ssh deploy@$DEPLOY_HOST "docker pull $DOCKER_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHA && docker compose -f /opt/app/docker-compose.yml up -d"
    - bash ci/scripts/notify.sh "Deployed to staging"
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  extends: .deploy-base
  variables:
    DEPLOY_HOST: $PRODUCTION_HOST
    DEPLOY_ENV: production
  script:
    - ssh deploy@$DEPLOY_HOST "docker pull $DOCKER_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHA && docker compose -f /opt/app/docker-compose.yml up -d"
    - bash ci/scripts/notify.sh "Deployed to production"
  environment:
    name: production
    url: https://example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
