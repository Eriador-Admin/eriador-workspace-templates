global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

    timeout connect 5s
    timeout client  30s
    timeout server  30s

    retries 3
    retry-on all-retryable-errors

    default-server init-addr libc,none

# ─── Stats Dashboard ─────────────────────────────────
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends

# ─── HTTP Frontend ────────────────────────────────────
frontend http_front
    bind *:80

    # ACL routing
    acl is_api path_beg /api/

    # Route to backends
    use_backend api_servers if is_api
    default_backend web_servers

# ─── API Backend (round-robin) ────────────────────────
backend api_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    http-request set-path "%[path,regsub(^/api/,/)]"
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request add-header X-Forwarded-Proto https if { ssl_fc }

    server api-1 api:3000 check inter 3s fall 2 rise 2
    # Additional servers added by Docker Compose replicas

# ─── Web Backend (least connections) ──────────────────
backend web_servers
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    server web-1 web:3000 check inter 3s fall 2 rise 2
