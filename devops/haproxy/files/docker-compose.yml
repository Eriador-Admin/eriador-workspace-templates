version: "3.8"

services:
  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "${HAPROXY_HTTP_PORT:-80}:80"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./services/api
    deploy:
      replicas: 3
    restart: unless-stopped

  web:
    build: ./services/web
    deploy:
      replicas: 2
    restart: unless-stopped
